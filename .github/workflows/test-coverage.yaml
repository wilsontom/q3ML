# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at
# https://github.com/r-lib/actions#where-to-find-help

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            bioc::mzR
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )
          print(cov)

          percent <- as.integer(round(covr::percent_coverage(cov)))
          cat("Coverage:", percent, "%\n")

          color <- if (percent >= 90) {
            "brightgreen"
          } else if (percent >= 80) {
            "green"
          } else if (percent >= 70) {
            "yellowgreen"
          } else if (percent >= 60) {
            "yellow"
          } else if (percent >= 50) {
            "orange"
          } else {
            "red"
          }

          writeLines(as.character(percent), "coverage_percent.txt")
          writeLines(color, "coverage_color.txt")
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

      - name: Generate coverage badge
        run: |
          COVERAGE=$(cat coverage_percent.txt)
          COVERAGE_COLOR=$(cat coverage_color.txt)

          echo "Coverage: $COVERAGE%"
          echo "Color: $COVERAGE_COLOR"

          mkdir -p badges
          curl -fsSL "https://raw.githubusercontent.com/pachadotdev/ghacoveragebadge/refs/heads/main/badges/${COVERAGE_COLOR}.svg" > badges/coverage.svg

          sed -i "s/{{ COVERAGE }}/${COVERAGE}/g" badges/coverage.svg
        shell: bash

      - name: Commit coverage badge
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          cp badges/coverage.svg "${RUNNER_TEMP}/coverage.svg"

          git checkout -B coverage
          git rm -rf . || true

          mkdir -p badges
          cp "${RUNNER_TEMP}/coverage.svg" badges/coverage.svg
          git add badges/coverage.svg

          if ! git diff --staged --quiet; then
            git commit -m "Update coverage badge"
            git push --force origin coverage
          else
            echo "No changes to commit"
          fi
        shell: bash
